name: Actualizar ranking

on:
  # GitHub usa hora UTC. 01:00 UTC del jueves = 22:00 del miércoles en Chile con horario de verano,
  # 02:00 UTC = 22:00 con horario de invierno. El paso "Revisar hora" deja correr solo la que cae a las 22:00.
  schedule:
    - cron: "0 1 * * 4"
    - cron: "0 2 * * 4"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar hora
        id: gate
        run: |
          hora=$(TZ=America/Santiago date +%H)
          echo "Hora en Chile: $hora"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "scrape=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$hora" = "22" ]; then
            echo "scrape=true" >> "$GITHUB_OUTPUT"
          else
            echo "scrape=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.scrape == 'true'
        with:
          python-version: "3.12"

      - name: Descargar resultados de melee.gg
        if: steps.gate.outputs.scrape == 'true'
        run: python scraper/scrape.py

      - name: Guardar datos en el repositorio
        if: steps.gate.outputs.scrape == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "Actualizar ranking $(TZ=America/Santiago date +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.scrape == 'true' || github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.scrape == 'true' || github.event_name == 'push'
        with:
          path: site
    outputs:
      deploy: ${{ steps.gate.outputs.scrape == 'true' || github.event_name == 'push' }}

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
